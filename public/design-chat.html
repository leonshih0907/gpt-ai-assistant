<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計創意對話</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #0f0f1a;
    color: #e8e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: #1a1a2e;
    border-bottom: 1px solid #2a2a4a;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 10;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-icon { font-size: 22px; }
  .header-title {
    font-size: 18px;
    font-weight: 700;
    color: #f7c331;
    letter-spacing: 0.5px;
  }
  .btn-new {
    background: transparent;
    border: 1px solid #f7c331;
    color: #f7c331;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-new:hover { background: rgba(247,195,49,0.15); }
  .mode-row {
    background: #1a1a2e;
    border-bottom: 1px solid #2a2a4a;
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .mode-row::-webkit-scrollbar { display: none; }
  .mode-btn {
    background: #12122a;
    border: 1px solid #2a2a4a;
    color: #a0a0c0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .mode-btn:hover { border-color: #f7c331; color: #f7c331; }
  .mode-btn.active {
    background: #f7c331;
    border-color: #f7c331;
    color: #0f0f1a;
    font-weight: 600;
  }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #2a2a4a transparent;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
  .msg-row {
    display: flex;
    flex-direction: column;
  }
  .msg-row.user { align-items: flex-end; }
  .msg-row.ai { align-items: flex-start; }
  .bubble {
    max-width: min(480px, 85%);
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }
  .bubble.user {
    background: #e63b2a;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    background: #1e2a4a;
    color: #d8d8f0;
    border-bottom-left-radius: 4px;
  }
  .bubble img {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 6px;
    display: block;
  }
  .dalle-prompt {
    font-size: 11px;
    color: #6870a0;
    margin-top: 6px;
    font-style: italic;
  }
  .action-chips {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .chip {
    background: #12122a;
    border: 1px solid #2a2a4a;
    color: #a0a0c0;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover { border-color: #f7c331; color: #f7c331; }
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .loading-dots span {
    width: 6px;
    height: 6px;
    background: #6870a0;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
  .input-area {
    background: #1a1a2e;
    border-top: 1px solid #2a2a4a;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1;
    background: #12122a;
    border: 1px solid #2a2a4a;
    color: #e8e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  .input-area textarea:focus { border-color: #f7c331; }
  .input-area textarea::placeholder { color: #3a3a6a; }
  .btn-send {
    background: #e63b2a;
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .btn-send:hover { background: #c52d1e; }
  .btn-send:disabled { background: #3a3a6a; cursor: not-allowed; }
  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: #4a4a7a;
  }
  .welcome .icon { font-size: 48px; margin-bottom: 12px; }
  .welcome p { font-size: 14px; line-height: 1.8; }
  @media (max-width: 480px) {
    .header-title { font-size: 16px; }
    .bubble { max-width: 92%; }
    .chat-area { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <span class="header-icon">🎨</span>
    <span class="header-title">設計創意對話</span>
  </div>
  <button class="btn-new" id="btnNew">新對話</button>
</header>

<div class="mode-row" id="modeRow">
  <button class="mode-btn active" data-mode="inspire">設計靈感</button>
  <button class="mode-btn" data-mode="sketch">設計草圖</button>
  <button class="mode-btn" data-mode="palette">配色建議</button>
  <button class="mode-btn" data-mode="brief">設計簡報</button>
  <button class="mode-btn" data-mode="expand">創意擴展</button>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <div class="icon">✦</div>
    <p>選擇設計模式，輸入你的主題<br>開始你的視覺設計創作之旅</p>
  </div>
</div>

<div class="input-area">
  <textarea id="inputMsg" placeholder="輸入設計主題或描述…" rows="1"></textarea>
  <button class="btn-send" id="btnSend" title="發送">↑</button>
</div>

<script>
  const modeLabels = {
    inspire: '設計靈感',
    sketch: '設計草圖',
    palette: '配色建議',
    brief: '設計簡報',
    expand: '創意擴展',
  };

  let sessionId = localStorage.getItem('designSessionId') || null;
  let currentMode = 'inspire';
  let isLoading = false;

  const chatArea = document.getElementById('chatArea');
  const inputMsg = document.getElementById('inputMsg');
  const btnSend = document.getElementById('btnSend');
  const btnNew = document.getElementById('btnNew');
  const welcome = document.getElementById('welcome');

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const lines = html.split('\n');
    const out = [];
    let inList = false;
    for (const line of lines) {
      const listMatch = line.match(/^(\d+)\.\s+(.+)/);
      if (listMatch) {
        if (!inList) { out.push('<ol style="padding-left:18px;margin:4px 0">'); inList = true; }
        out.push(`<li>${listMatch[2]}</li>`);
      } else {
        if (inList) { out.push('</ol>'); inList = false; }
        out.push(line === '' ? '<br>' : `<span>${line}</span><br>`);
      }
    }
    if (inList) out.push('</ol>');
    return out.join('');
  }

  function scrollBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
  }

  function addUserBubble(text) {
    if (welcome) welcome.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble user';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatArea.appendChild(row);
    scrollBottom();
  }

  function addLoadingBubble() {
    if (welcome) welcome.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'loadingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble ai';
    bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    chatArea.appendChild(row);
    scrollBottom();
    return row;
  }

  function removeLoadingBubble() {
    const el = document.getElementById('loadingRow');
    if (el) el.remove();
  }

  function addAiBubble(result) {
    const row = document.createElement('div');
    row.className = 'msg-row ai';

    const bubble = document.createElement('div');
    bubble.className = 'bubble ai';

    if (result.type === 'image' && result.imageUrl) {
      const img = document.createElement('img');
      img.src = result.imageUrl;
      img.alt = 'Generated design';
      bubble.appendChild(img);
      if (result.dallePrompt) {
        const promptEl = document.createElement('div');
        promptEl.className = 'dalle-prompt';
        promptEl.textContent = result.dallePrompt;
        bubble.appendChild(promptEl);
      }
    } else {
      bubble.innerHTML = renderMarkdown(result.text || '');
    }

    row.appendChild(bubble);

    if (result.suggestedActions && result.suggestedActions.length > 0) {
      const chips = document.createElement('div');
      chips.className = 'action-chips';
      for (const action of result.suggestedActions) {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = modeLabels[action] || action;
        chip.addEventListener('click', () => {
          setMode(action);
          inputMsg.focus();
        });
        chips.appendChild(chip);
      }
      row.appendChild(chips);
    }

    chatArea.appendChild(row);
    scrollBottom();
  }

  async function sendMessage() {
    const text = inputMsg.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    btnSend.disabled = true;
    inputMsg.value = '';
    inputMsg.style.height = 'auto';

    addUserBubble(text);
    addLoadingBubble();

    try {
      const body = { mode: currentMode, message: text };
      if (sessionId) body.sessionId = sessionId;

      const res = await fetch('/api/design/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json();
      removeLoadingBubble();

      if (data.sessionId) {
        sessionId = data.sessionId;
        localStorage.setItem('designSessionId', sessionId);
      }

      addAiBubble(data);
    } catch (err) {
      removeLoadingBubble();
      addAiBubble({ type: 'text', text: '連線錯誤，請稍後再試。', suggestedActions: [] });
    }

    isLoading = false;
    btnSend.disabled = false;
    inputMsg.focus();
  }

  btnSend.addEventListener('click', sendMessage);

  inputMsg.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputMsg.addEventListener('input', () => {
    inputMsg.style.height = 'auto';
    inputMsg.style.height = Math.min(inputMsg.scrollHeight, 120) + 'px';
  });

  document.getElementById('modeRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (btn) setMode(btn.dataset.mode);
  });

  btnNew.addEventListener('click', async () => {
    if (sessionId) {
      try {
        await fetch(`/api/design/session/${sessionId}`, { method: 'DELETE' });
      } catch (_) {}
    }
    sessionId = null;
    localStorage.removeItem('designSessionId');
    chatArea.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'welcome';
    w.id = 'welcome';
    w.innerHTML = '<div class="icon">✦</div><p>選擇設計模式，輸入你的主題<br>開始你的視覺設計創作之旅</p>';
    chatArea.appendChild(w);
  });

  fetch('/api/design/health').catch(() => {});
</script>
</body>
</html>
